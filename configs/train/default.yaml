# Training hyperparameters

epochs: 5
batch_size: 16
learning_rate: 0.001
weight_decay: 0.0001
num_workers: 4
pin_memory: true
shuffle: true

optimizer:
  name: adam  # options: adam, adamw, sgd
  params:
    momentum: 0.9    # used when optimizer == sgd

# LR scheduler
scheduler:
  name: cosine   # options: cosine, step, plateau, none
  params:
    T_max: 100
    eta_min: 0.0001

# Loss function
loss_function:
  name: cross_entropy  # options: cross_entropy, focal
  params:
    label_smoothing: 0.0          # used by cross_entropy

# Mixed precision
use_amp: false

# Gradient clipping (null disables)
gradient_clip: null

# Checkpointing
save_freq: 1           # save checkpoint every N epochs (checkpoint_XXX.pth)
save_best_only: true   # also track and save best model by validation accuracy
resume: null           # path to checkpoint to resume from

# Early stopping
early_stopping_patience: 10
