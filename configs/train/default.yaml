# Training hyperparameters

epochs: 3
batch_size: 32
num_workers: 0
pin_memory: false
shuffle: true

optimizer:
  name: Adam  # options: Adam, AdamW, SGD
  params:
    lr: 0.001
    weight_decay: 0.0001

# LR scheduler
scheduler:
  name: CosineAnnealingLR   # options: CosineAnnealingLR, StepLR, ReduceLROnPlateau, None
  params:
    T_max: 100
    eta_min: 0.0001

# Loss function
loss_function:
  name: CrossEntropyLoss   # options: CrossEntropyLoss, FocalLoss
  params: {}

# Mixed precision
use_amp: false

# Gradient clipping (null disables)
gradient_clip: null

# Checkpointing
save_freq: 1           # save checkpoint every N epochs (checkpoint_XXX.pth)
save_best_only: true   # also track and save best model by validation accuracy
resume: null           # path to checkpoint to resume from

# Early stopping
early_stopping_patience: 10
