architecture: "DeepLabV3Plus"
encoder_name: "resnet18"
encoder_weights: "imagenet"
height: 368
width: 480
in_channels: 3
classes: 20
params:
  dropout: 0.2
  activation: null
preprocessing:
  - name: Resize
    params:
      height: 368
      width: 480
      interpoltaion: 2
