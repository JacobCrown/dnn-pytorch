architecture: "unetplusplus"
encoder_name: "mobilenet-v2"
encoder_weights: "imagenet"
height: 384
width: 480
in_channels: 3
classes: 20
params:
  dropout: 0.2
  activation: null
preprocessing:
  - name: Resize
    params:
      height: 384
      width: 480
      interpolation: 2
  - name: Normalize
    params:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  - name: ToTensorV2
    params:
      transpose_mask: false