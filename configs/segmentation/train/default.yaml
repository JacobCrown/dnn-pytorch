# Training hyperparameters
epochs: 10
batch_size: 8
num_workers: 4
pin_memory: true
shuffle: true

persistent_workers: false
prefetch_factor: 2
drop_last: false

optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.01

# T_max should match epochs for a full cosine cycle.
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 50
    eta_min: 0.0001

loss_function:
  - name: FocalLoss
    weight: 0.5
    params:
      mode: multiclass
      ignore_index: 255
      gamma: 2.0
  - name: DiceLoss
    weight: 0.5
    params:
      mode: multiclass
      ignore_index: 255
      smooth: 1e-6

use_amp: true
gradient_clip: null

resume_from_checkpoint: null
early_stopping_patience: 10

root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

visualize_pre_train: true
visualize_post_train: true
