# Training hyperparameters
epochs: 50
batch_size: 12
num_workers: 8
pin_memory: true
shuffle: true

persistent_workers: false
prefetch_factor: 2
drop_last: false

optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.01

# T_max should match epochs for a full cosine cycle.
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 50
    eta_min: 0.0001

loss_function:
  - name: FocalLoss
    weight: 0.5
    params:
      mode: multiclass
      ignore_index: 255
      gamma: 2.0
  - name: DiceLoss
    weight: 0.5
    params:
      mode: multiclass
      ignore_index: 255
      smooth: 1e-6

use_amp: true
gradient_clip: null

ema:
  enabled: false
  decay: 0.9999
  update_after_step: 0
  update_every: 1

tracking:
  local_enabled: true
  wandb_enabled: false
  wandb_project: null
  tags: []

distributed:
  strategy: single
  backend: nccl
  find_unused_parameters: false

resume_from_checkpoint: null
early_stopping_patience: null

root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

visualize_pre_train: false
visualize_post_train: false
