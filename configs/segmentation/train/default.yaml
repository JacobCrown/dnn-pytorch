# Training hyperparameters

epochs: 50
batch_size: 12
num_workers: 8
pin_memory: true
shuffle: true

# DataLoader performance knobs
persistent_workers: false
prefetch_factor: 2
drop_last: false

optimizer:
  name: AdamW  # options: Adam, AdamW, SGD
  params:
    lr: 0.001
    weight_decay: 0.01

# LR scheduler
scheduler:
  name: CosineAnnealingLR   # options: CosineAnnealingLR, StepLR, ReduceLROnPlateau, None
  params:
    T_max: 100
    eta_min: 0.0001

# Loss function(s) - can be single or list of losses
# When using multiple losses, they are combined with optional weights
loss_function:
  - name: FocalLoss   # options: CrossEntropyLoss, FocalLoss, SoftCrossEntropyLoss, DiceLoss, etc.
    weight: 0.5
    params:
      mode: "multiclass"
      ignore_index: 255
  - name: DiceLoss
    weight: 0.5
    params:
      mode: "multiclass"
      ignore_index: 255

# Mixed precision
use_amp: true

# Gradient clipping (null disables)
gradient_clip: null

# Resume from checkpoint
resume_from_checkpoint: null

# Early stopping
early_stopping_patience: null

# Root directory for output files
root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

# visualization flags
visualize_pre_train: true
visualize_post_train: true