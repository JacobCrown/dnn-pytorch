package: _global_

defaults:
  - _self_
  - augmentations: default
  - train: default
  - data: default
  - model: default
  - override hydra/hydra_logging: disabled

hydra:
  # Same directory as segmentation_experiment_root(): <model>/<HxW>_<epochs>epochs_<bs>bs
  run:
    dir: ${train.root_dir}/segmentation/${basename:${data.root}}/${model.architecture}_${model.encoder_name}/${model.height}hx${model.width}w_${train.epochs}epochs_${train.batch_size}bs

  sweep:
    subdir: ${train.root_dir}/segmentation/${basename:${data.root}}/${model.architecture}_${model.encoder_name}/${model.height}hx${model.width}w_${train.epochs}epochs_${train.batch_size}bs
