# Training hyperparameters
epochs: 3
batch_size: 1024
num_workers: 12
pin_memory: true
shuffle: true

# DataLoader performance knobs
persistent_workers: true
prefetch_factor: 1
drop_last: true

optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.0001

# T_max should match epochs for a full cosine cycle.
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 30
    eta_min: 0.0001

loss_function:
  - name: SoftCrossEntropyLoss
    weight: 1.0
    params:
      smooth_factor: 0.1

use_amp: true
gradient_clip: null

resume_from_checkpoint: null
early_stopping_patience: 10

root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

# visualization flags
visualize_pre_train: true
visualize_post_train: true