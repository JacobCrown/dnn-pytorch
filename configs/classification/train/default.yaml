# Training hyperparameters
epochs: 5
batch_size: 256
num_workers: 4
pin_memory: true
shuffle: true

# DataLoader performance knobs
persistent_workers: true
prefetch_factor: 1
drop_last: true

optimizer:
  name: AdamW  # options: Adam, AdamW, SGD
  params:
    lr: 0.001
    weight_decay: 0.0001

# LR scheduler
scheduler:
  name: CosineAnnealingLR   # options: CosineAnnealingLR, StepLR, ReduceLROnPlateau, None
  params:
    T_max: 100
    eta_min: 0.0001

loss_function:
  - name: FocalLoss
    weight: 0.65
    params:
      mode: "multiclass"
      gamma: 2.0
  
  - name: DiceLoss
    weight: 0.35
    params:
      mode: "multiclass"
      ignore_index: 255
      smooth: 1e-6

# Mixed precision
use_amp: true

# Gradient clipping (null disables)
gradient_clip: null

# Exponential moving average of model weights
ema:
  enabled: false
  decay: 0.9999
  update_after_step: 0
  update_every: 1

# Resume from checkpoint path
resume_from_checkpoint: null
# Run test evaluation with:
# python -m src.classification.test model=default \
#   eval_checkpoint="/abs/path/to/checkpoints/best.pth"

# Early stopping
early_stopping_patience: 10

# Root directory for output files
root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

# visualization flags
visualize_pre_train: true
visualize_post_train: true