# Training hyperparameters
epochs: 5
batch_size: 256
num_workers: 4
pin_memory: true
shuffle: true

# DataLoader performance knobs
persistent_workers: true
prefetch_factor: 1
drop_last: true

optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.0001

# T_max should match epochs for a full cosine cycle.
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 5
    eta_min: 0.0001

loss_function:
  - name: FocalLoss
    weight: 1.0
    params:
      mode: multiclass
      gamma: 2.0

use_amp: true
gradient_clip: null

ema:
  enabled: false
  decay: 0.9999
  update_after_step: 0
  update_every: 1

tracking:
  local_enabled: true
  wandb_enabled: false
  wandb_project: null
  tags: []

distributed:
  strategy: single
  backend: nccl
  find_unused_parameters: false

resume_from_checkpoint: null
early_stopping_patience: 10

root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"

# visualization flags
visualize_pre_train: true
visualize_post_train: true