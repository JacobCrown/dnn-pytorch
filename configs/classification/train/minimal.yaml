# Minimal settings for smoke tests and quick local iteration.
epochs: 1
batch_size: 8
num_workers: 0
pin_memory: false
shuffle: true
persistent_workers: false
prefetch_factor: 2
drop_last: false
use_amp: false
gradient_clip: null
early_stopping_patience: null
resume_from_checkpoint: null
root_dir: "output"
checkpoints_dir: "checkpoints"
logs_dir: "logs"
visualize_dir: "visualizations"
visualize_pre_train: false
visualize_post_train: false

tracking:
  local_enabled: true
  wandb_enabled: false
  wandb_project: null
  tags: []

distributed:
  strategy: single
  backend: nccl
  find_unused_parameters: false

optimizer:
  name: Adam
  params:
    lr: 0.001

scheduler:
  name: StepLR
  params:
    step_size: 1
    gamma: 1.0

loss_function:
  - name: FocalLoss
    weight: 1.0
    params:
      mode: multiclass
      gamma: 2.0
