# Default dataset: CIFAR-100 folder-per-class layout under data/classification/cifar100/
root: "data/classification/cifar100"
train_dir: "train"
val_dir: "test"
test_dir: "test"
extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

# Use null for full datasets; set an integer only while debugging.
max_samples: null

# Merge multiple class folders into one label (optional).
class_mapping: null
