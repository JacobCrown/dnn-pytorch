root: "data/classification/cifar-100"
train_dir: "train"
val_dir: "test"
test_dir: "test"
extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]
# For debugging purposes, optional
max_samples: 100

# Merge multiple class folders (names must match subdirs under train/val/test) into one training label.
# Set to null when not used.
class_mapping: null
# Example:
# class_mapping:
#   - name: Car
#     map_classes:
#       - Car 1
#       - Car 2
#       - Car 3
#       - Car 4
#   - name: Bicycle
#     map_classes:
#       - Bicycle 1
#       - Bicycle 2
#       - Bicycle 3
#       - Bicycle 4