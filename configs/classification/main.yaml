# Base configuration for image classification experiments
# This file composes core data & model settings with reusable train and augmentation configs.
package: _global_

defaults:
  - _self_
  - augmentations: default
  - train: default

# -----------------------------------------------------------------------------
# Dataset paths
# -----------------------------------------------------------------------------

data:
  root: "data/classification/mnist"
  train_dir: "images/train"
  val_dir: "images/val"
  test_dir: images/test
  extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]
  # For debugging purposes, optional
  max_samples: null

# -----------------------------------------------------------------------------
# Model definition (timm)
# -----------------------------------------------------------------------------

model:
  name: "resnet18"
  num_classes: 10
  in_channels: 1
  pretrained: true
  dropout: 0.2
  # Freeze control
  freeze_backbone: false         # freeze all except classifier head
  freeze_layers: []              # list of regexes or module name prefixes to freeze
  unfreeze_layers: []            # allowlists (applied after freeze)
  partial_bn: false              # freeze batchnorm stats/affine in backbone
  width: 28
  height: 28

# The `../train: default` and `../augmentations: default` entries above
# inject `train` and `augmentations` nodes directly into this config.
