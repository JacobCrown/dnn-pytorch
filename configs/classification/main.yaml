package: _global_

defaults:
  - _self_
  - augmentations: default
  - train: default
  - data: default
  - model: default
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: ${train.root_dir}/classification/${basename:${data.root}}/${model.name}_${model.height}x${model.width}_${train.epochs}epochs_${train.batch_size}bs

  sweep:
    subdir: ${train.root_dir}/classification/${basename:${data.root}}/${model.name}_${model.height}x${model.width}_${train.epochs}epochs_${train.batch_size}bs
