# Optuna hyperparameter search for classification.
n_trials: 20
timeout: null
direction: minimize
objective_metric: best_val_loss

# Set a fixed name to resume the same study. Null creates a timestamped study name.
study_name: null
storage_dir: ${train.root_dir}/optuna/classification
load_if_exists: true
seed: 42
# This entrypoint runs trials sequentially to keep GPU logging/checkpoints predictable.
n_jobs: 1
final_root_dir: null

search_space:
  - name: model.name
    type: categorical
    choices: ["resnet18", "resnet34", "resnext26ts", "convnext_tiny", "convnextv2_tiny", "convnext_small", "convnextv2_small"]
  - name: train.optimizer.params.lr
    type: float
    low: 0.00001
    high: 0.01
    log: true
  - name: train.optimizer.params.weight_decay
    type: float
    low: 0.000001
    high: 0.01
    log: true
  - name: train.batch_size
    type: categorical
    choices: [64, 128, 256]
  - name: model.dropout
    type: float
    low: 0.0
    high: 0.5
    step: 0.05

wandb:
  enabled: false
  project: dnn-pytorch
  entity: null
  group: null
  tags: []
  mode: null
