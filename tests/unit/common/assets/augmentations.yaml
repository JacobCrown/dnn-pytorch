# Albumentations augmentation configuration

- name: HorizontalFlip
  params:
    p: 0.5

- name: VerticalFlip
  params:
    p: 0.5

- name: Affine
  params:
    p: 0.8
    translate_percent:
      x: [0.08, 0.08]
      y: [0.08, 0.08]
    scale:
      x: [0.85, 1.15]
      y: [0.85, 1.15]
    rotate: [-25, 25]
    border_mode: 4
    interpolation: 1
    fill: 0

- name: Perspective
  params:
    p: 0.6

- name: GridDistortion
  params:
    p: 0.5

- name: CoarseDropout
  params:
    p: 0.5

- name: RandomBrightnessContrast
  params:
    p: 0.7

- name: RandomGamma
  params:
    gamma_limit: [80, 120]
    p: 0.5

- name: RandomRain
  params:
    p: 0.3

- name: RandomFog
  params:
    p: 0.3

- name: RandomShadow
  params:
    p: 0.3

- name: RandomSnow
  params:
    p: 0.3

- name: OneOf
  params:
    p: 0.5
    transforms:
      - name: MotionBlur
        params:
          blur_limit: [3, 7]
      - name: MedianBlur
        params:
          blur_limit: [3, 7]
      - name: GaussianBlur
        params:
          blur_limit: [3, 7]

- name: HueSaturationValue
  params:
    p: 0.5
    hue_shift_limit: 20
    sat_shift_limit: 30
