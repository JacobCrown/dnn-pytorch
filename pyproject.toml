[project]
name = "dnn-pytorch"
version = "0.1.0"
description = "Project designed to simplify the process of training and using the deep learning models, of various types in PyTorch. Those types include: Classification, Segmentation, Reidentification, and more."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "albumentations>=2.0.8",
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "imageio>=2.37.0",
  "matplotlib>=3.10.5",
  "omegaconf>=2.3.0",
  "opencv-python>=4.12.0.88",
  "pillow>=11.3.0",
  "pytest>=8.4.1",
  "scikit-learn>=1.7.1",
  "seaborn>=0.13.2",
  "timm>=1.0.19",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "tqdm>=4.66.4",
  "segmentation-models-pytorch>=0.5.0",
  "torchinfo>=1.8.0",
  "bs4>=0.0.2",
  "pywikibot>=10.7.0",
  "cairosvg>=2.8.2",
  "torchmetrics>=1.8.2",
  "onnx>=1.20.1",
  "onnxruntime>=1.23.2",
  "optuna>=4.8.0",
  "rich>=15.0.0",
  "wandb>=0.26.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"},
]
torchvision = [
  { index = "pytorch-cu128"},
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "snakeviz>=2.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
dnn-search-classification = "src.classification.optuna_search:main"
dnn-train-best-classification = "src.classification.train_best:main"
dnn-train-classification = "src.classification.main:main"
dnn-train-segmentation = "src.segmentation.main:main"
dnn-compare = "src.common.experiment_registry:main"
dnn-export-classification = "src.classification.export:main"
dnn-export-segmentation = "src.segmentation.export:main"
dnn-serve-classification = "src.classification.serve:main"
dnn-serve-segmentation = "src.segmentation.serve:main"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
  "src/object_detection/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
  "N812",  # lowercase module imported as non-lowercase alias (allow A for albumentations)
  "N818",  # Exception name should end with Error
  "B905",  # Using deprecated alias for strict=False
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
