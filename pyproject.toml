[project]
name = "dnn-pytorch"
version = "0.1.0"
description = "Project designed to simplify the process of training and using the deep learning models, of various types in PyTorch. Those types include: Classification, Segmentation, Reidentification, and more."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "albumentations>=2.0.8",
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "imageio>=2.37.0",
  "matplotlib>=3.10.5",
  "omegaconf>=2.3.0",
  "opencv-python>=4.12.0.88",
  "pillow>=11.3.0",
  "pytest>=8.4.1",
  "scikit-learn>=1.7.1",
  "seaborn>=0.13.2",
  "tensorboard",
  "timm>=1.0.19",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "tqdm>=4.66.4",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"},
]
torchvision = [
  { index = "pytorch-cu128"},
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
dnn-train-classification = "src.classification.main:main"
dnn-train-segmentation = "src.segmentation.main:main"
